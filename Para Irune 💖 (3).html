@keyframes gl{0%,100%{transform:translate(0,0);filter:none}10%{transform:translate(-8px,3px) skewX(3deg);filter:hue-rotate(90deg) saturate(3)}25%{transform:translate(7px,-4px);filter:invert(1)}40%{transform:translate(-5px,6px) skewX(-4deg);filter:hue-rotate(200deg)}55%{transform:translate(9px,2px);filter:invert(1) hue-rotate(60deg)}70%{transform:translate(-7px,-5px) skewX(2deg);filter:contrast(3)}85%{transform:translate(4px,5px);filter:hue-rotate(300deg) saturate(4)}}

<script>
var $p=function(id){return document.getElementById(id)},phone=$p("phone"),win=$p("win"),home=$p("home"),root=null;
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim()}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function $(id){return root.querySelector("#"+id)}
function Spr(x,k,c){this.x=x;this.v=0;this.t=x;this.k=k||170;this.c=c||22;this.run=false;this.cb=null;this.done=null}
Spr.prototype.go=function(t,v0){var s=this;s.t=t;if(v0!==undefined)s.v=v0;if(s.run)return;s.run=true;var last=performance.now();
(function f(now){var dt=Math.min((now-last)/1000,1/30);last=now;var n=Math.max(1,Math.ceil(dt/0.004)),h=dt/n;
for(var i=0;i<n;i++){var a=-s.k*(s.x-s.t)-s.c*s.v;s.v+=a*h;s.x+=s.v*h}
if(Math.abs(s.v)<0.05&&Math.abs(s.x-s.t)<0.003){s.x=s.t;s.cb&&s.cb(s.x);s.run=false;var d=s.done;s.done=null;d&&d();return}
s.cb&&s.cb(s.x);requestAnimationFrame(f)})(last)};
function press(el,sc){var sp=new Spr(1,800,28);sp.cb=function(x){el.style.transform="scale("+x+")"};el.addEventListener("pointerdown",function(){sp.go(sc||.88)});["pointerup","pointerleave","pointercancel"].forEach(function(ev){el.addEventListener(ev,function(){sp.go(1)})})}
function hearts(n){for(var k=0;k<n;k++){(function(){var h=document.createElement("div");h.className="heart";h.textContent=["💖","💖","✨"][Math.floor(Math.random()*3)];h.style.left=Math.random()*92+"%";h.style.animationDelay=Math.random()*.8+"s";phone.appendChild(h);setTimeout(function(){h.remove()},4500)})()}}
function tick(){var d=new Date(),t=d.getHours()+":"+("0"+d.getMinutes()).slice(-2);$p("tm").textContent=t;$p("lt1").textContent=t;$p("ld").textContent=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
tick();setInterval(tick,10000);
if(location.hash==="#reset"){try{localStorage.removeItem("f")}catch(e){}history.replaceState(null,"",location.pathname)}
var K=[0,{w:"ATARDECER",a:["atardecer"]},{w:"BRUJULA",a:["brujula"]},{w:"RECUERDO",a:["recuerdo","recuerdos"]},{w:"AMANECER",a:["amanecer"],d:["alegria"]},{w:"ZAFIRO",a:["zafiro"]},{w:"OCEANO",a:["oceano"]}];
var found=[0,0,0,0,0,0,0];
try{var sv=JSON.parse(localStorage.getItem("f"));if(sv)found=sv}catch(e){}
function count(){var c=0;for(var k=1;k<=6;k++)if(found[k])c++;return c}
function save(){try{localStorage.setItem("f",JSON.stringify(found))}catch(e){}}
function kf(n,l){return'<div class="kf" data-n="'+n+'"><p class="mut">'+l+'</p></div>'}
var bsp=new Spr(-160,420,30);bsp.cb=function(y){$p("bn").style.transform="translateY("+y+"px)"};
function banner(t,s){$p("bn").innerHTML='<b>'+t+'</b>'+s;bsp.go(0);setTimeout(function(){bsp.go(-160)},3400)}
function initKeys(){var els=root.querySelectorAll(".kf");for(var e=0;e<els.length;e++){(function(el){var n=+el.getAttribute("data-n");
if(found[n]){el.innerHTML+='<p class="msg good">✅ Llave '+n+': <b>'+K[n].w+'</b></p>';return}
el.innerHTML+='<input class="kin" placeholder="Llave '+n+'…" autocomplete="off"><button class="go">Probar llave</button><div class="msg"></div>';
var inp=el.querySelector("input"),m=el.querySelector(".msg");
function c(){if(K[n].a.indexOf(norm(inp.value))>-1){found[n]=1;save();hearts(10);m.className="msg good";m.textContent="¡Esa es! 💖";setTimeout(function(){closeApp();renderHome();banner("🔑 ¡Llave "+n+" conseguida!",K[n].w+" · guardada en el llavero")},650)}else{m.className="msg bad";m.textContent=(K[n].d&&K[n].d.indexOf(norm(inp.value))>-1)?"Esa señal era una interferencia 📻":"Esa llave no encaja…"}}
el.querySelector("button").onclick=c;inp.onkeydown=function(ev){if(ev.key==="Enter")c()}})(els[e])}}
function look(q,filter,box){var t=norm(q).split(" ").filter(Boolean),out=[];
for(var n in P){if(filter&&n.indexOf(filter)!==0)continue;var g=P[n].tags||[];for(var a=0;a<t.length;a++){for(var b=0;b<g.length;b++){if(g[b]===t[a]||(t[a].length>3&&g[b].indexOf(t[a])===0)){if(out.indexOf(n)<0)out.push(n)}}}}
$(box).innerHTML=out.length?out.map(function(n){return'<a href="#'+n+'"><b>'+P[n].t+'</b></a>'}).join(""):'<p class="mut">Sin resultados.</p>'}
function searchBox(){return'<input id="q" placeholder="Buscar…" autocomplete="off"><button class="go" id="sb">Buscar</button><div class="res" id="r"></div>'}
function wireSearch(f){var q=$("q");$("sb").onclick=function(){look(q.value,f,"r")};q.onkeydown=function(e){if(e.key==="Enter")look(q.value,f,"r")}}
var P={
buscalo:{t:"Buscalo",tags:[],h:'<h2>🔎 Buscalo</h2>'+searchBox(),i:function(){wireSearch("")}},
diario:{t:"Diario",tags:["diego","diario","novio"],hint:"Léelo con calma.",h:'<h2>📖 El diario de Diego</h2><p>Hoy te escondí algo, Irune, y no te lo voy a poner fácil.</p><p>Dejé <b>seis llaves</b> repartidas por este móvil. Cada llave es una palabra y lleva un número. Algunas están a la vista; otras hay que ir a buscarlas, y a veces una página te manda a otra.</p><p>Cada vez que consigas una, el móvil la guardará en el llavero de la pantalla de inicio. Cuando tengas las seis, se abrirá la bóveda.</p><p class="mut">— Diego</p>'},
fotos:{t:"Fotos",tags:["fotos","galeria","album","recuerdos"],hint:"A veces el orden lo dice todo.",h:'<h2>🖼️ Álbum: Nosotros</h2><p class="mut">Toca cada foto para ver su recuerdo.</p><div class="pg" id="pg"></div><p style="margin-top:14px">Mira bien cómo empieza cada recuerdo, en orden.</p>'+kf(1,"Llave 1 · una palabra de 9 letras que se ve al caer el sol."),i:function(){var C=["Aquella primera conversación que se alargó y alargó.","Todas las veces que dijimos «cinco minutos más».","Algún plan tonto hecho a distancia, pero juntos.","Risas por mensaje a las tantas de la madrugada.","De cada foto tuya me sé la historia.","Esos audios que escucho dos veces.","Cada «buenas noches» que se hace corto.","Esperar tus mensajes, mi parte favorita del día.","Recordar lo que me haces sentir, una y otra vez."],pg=$("pg");
C.forEach(function(c,k){var d=document.createElement("div");d.className="ph";d.innerHTML="📷<small>"+(k+1)+"</small>";var o=0;press(d,.93);d.onclick=function(){o=!o;d.innerHTML=o?'<small>'+c+'</small>':"📷<small>"+(k+1)+"</small>"};pg.appendChild(d)})}},
noticias:{t:"El Correo",tags:["noticias","periodico","prensa"],h:'<h2>📰 El Correo</h2><div class="news"><a class="nw" href="#noticia-1"><small>ÚLTIMA HORA</small>Aparece una caja que «solo mira hacia una persona»</a><a class="nw" href="#noticia-2"><small>SUCESOS</small>Roban una gema azul de una joyería del centro</a><a class="nw" href="#noticia-6"><small>TECNOLOGÍA</small>Radioaficionados captan una señal nocturna que nadie logra descifrar</a><a class="nw" href="#noticia-3"><small>DEPORTES</small>La liga se decide con un gol en el último minuto</a><a class="nw" href="#noticia-4"><small>ECONOMÍA</small>Sube el precio del turrón antes de Navidad</a><a class="nw" href="#noticia-5"><small>TIEMPO</small>Sol y nubes, con riesgo de besos sorpresa</a></div>'},
"noticia-1":{t:"Aparece una caja misteriosa",tags:["caja","aguja","puerto","misteriosa"],h:'<small class="mut">ÚLTIMA HORA · Por Redacción</small><h2>Aparece una caja que «solo mira hacia una persona»</h2><p>Vecinos del puerto hallaron ayer un objeto metálico del tamaño de una mano, con tapa de cristal y una aguja imantada que, por mucho que se gire la caja, acaba señalando siempre en la misma dirección: la de una joven llamada Irune.</p><p>«Es increíble, nunca había visto nada igual», comentó una testigo. Los expertos aseguran que se trata de un antiguo instrumento de orientación y recomiendan consultar la entrada <i>Navegación antigua</i> en el <a href="#wiki">Wikiverso</a> para identificarlo.</p>'+kf(2,"Llave 2 · ¿cómo se llama el objeto? Empieza por B.")},
"noticia-2":{t:"Roban una gema azul",tags:["joyeria","robo","gema","sucesos"],h:'<small class="mut">SUCESOS · Por Redacción</small><h2>Roban una gema azul de una joyería del centro</h2><p>Una gema azul de unos tres quilates desapareció anoche de la vitrina principal de una joyería. El dueño asegura que «la piedra brillaba más cuando alguien pensaba en ella».</p><p>Los expertos la describen como una variedad del <b>corindón</b>, el mismo mineral con el que se forman otras piedras famosas. Para más información, consulten el <a href="#wiki">Wikiverso</a>.</p>'+kf(5,"Llave 5 · ¿cómo se llama la gema? Empieza por Z.")},
"noticia-3":{t:"Gol en el último minuto",tags:["liga","gol","futbol"],h:'<small class="mut">DEPORTES</small><h2>La liga se decide con un gol en el último minuto</h2><p>El delantero, que llevaba toda la tarde fallando, marcó de rebote en el minuto 94 y el estadio entero se vino abajo. «Yo solo pensaba en llamar a mi novia», declaró.</p>'},
"noticia-4":{t:"Sube el precio del turrón",tags:["turron","precio","navidad"],h:'<small class="mut">ECONOMÍA</small><h2>Sube el precio del turrón antes de Navidad</h2><p>Los expertos prevén que el turrón de Jijona suba un 8 % este año. Los consumidores aseguran que, aun así, comprarán el mismo.</p>'},
"noticia-5":{t:"Riesgo de besos sorpresa",tags:["tiempo","clima","besos"],h:'<small class="mut">TIEMPO</small><h2>Sol y nubes, con riesgo de besos sorpresa</h2><p>El pronóstico indica máximas suaves y una probabilidad muy alta de que alguien te piense hoy. No se esperan lluvias, salvo emocionales.</p>'},
"noticia-6":{t:"Señal nocturna sin descifrar",tags:["radioaficionados","senal","radio","tecnologia","canal"],h:'<small class="mut">TECNOLOGÍA · Por Redacción</small><h2>Radioaficionados captan una señal nocturna que nadie logra descifrar</h2><p>Una comunidad de radioaficionados asegura captar cada noche dos señales en onda corta. La del <b>primer canal</b> es solo una interferencia conocida, una palabra alegre que no significa nada para nadie.</p><p>El mensaje auténtico llega por el <b>segundo canal</b> y viene desplazado: cada letra aparece adelantada «más de dos pasos, pero menos de cuatro» en el alfabeto. «Quien gire la sintonía con paciencia lo oirá claro», dijo un aficionado.</p>'},

"wiki-navegacion":{t:"Navegación antigua",tags:["navegacion","antigua","instrumentos","astrolabio","sextante","marineros"],h:'<div class="wk"><h2>Navegación antigua</h2><p class="mut">De Wikiverso, la enciclopedia libre</p><p>Antes del GPS, los marinos se orientaban con ayuda de varios instrumentos.</p><p>El <b>astrolabio</b> permitía medir la altura de los astros sobre el horizonte. El <b>sextante</b>, más moderno, medía el ángulo entre un astro y el horizonte. El <b>reloj de arena</b> servía para calcular el tiempo de navegación.</p><p>La <b>brújula</b> consiste en una aguja imantada que se alinea con el campo magnético terrestre y señala el norte. Se guarda normalmente en una caja con tapa de cristal.</p><p class="mut">Véase también: <a href="#wiki-luna">Luna</a></p></div>'},
"wiki-corindon":{t:"Corindón",tags:["corindon","mineral","gema","rubi","zafiro","piedra"],h:'<div class="wk"><h2>Corindón</h2><p class="mut">De Wikiverso, la enciclopedia libre</p><p>El corindón es un mineral compuesto de óxido de aluminio, de gran dureza. Según las impurezas que contenga, recibe nombres distintos:</p><p>• El corindón rojo se llama <b>rubí</b>.<br>• El corindón azul se llama <b>zafiro</b>.<br>• El corindón amarillo, topacio oriental.<br>• El corindón rosa, también zafiro rosa.</p><p>Es el segundo mineral más duro después del diamante (cita requerida).</p></div>'},
"wiki-luna":{t:"Luna",tags:["luna","satelite"],h:'<div class="wk"><h2>Luna</h2><p class="mut">De Wikiverso, la enciclopedia libre</p><p>La Luna es el único satélite natural de la Tierra. Se encuentra a unos 384 400 km y la miran, cada noche, millones de personas, incluidas dos que están lejos y a veces la miran a la vez (cita requerida).</p><p class="mut">Véase también: <a href="#wiki-diego">Diego</a></p></div>'},
"wiki-ornitorrinco":{t:"Ornitorrinco",tags:["ornitorrinco","animal","australia"],h:'<div class="wk"><h2>Ornitorrinco</h2><p class="mut">De Wikiverso, la enciclopedia libre</p><p>Mamífero semiacuático de Australia con pico de pato y cola de castor. Es uno de los pocos mamíferos que ponen huevos.</p></div>'},
